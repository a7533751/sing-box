name: Build Core

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TAGS: with_gvisor,with_quic,with_dhcp,with_utls,with_provider,with_clash_api,badlinkname,tfogo_checklinkname0

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get latest go version
        id: go_version
        run: |
          echo go_version=$(curl -s https://raw.githubusercontent.com/actions/go-versions/main/versions-manifest.json | grep -oE '"version": "[0-9]{1}.[0-9]{1,}(.[0-9]{1,})?"' | head -1 | cut -d':' -f2 | sed 's/ //g; s/"//g') >> $GITHUB_OUTPUT

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ^1.25.3

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r29
          add-to-path: false
          local-cache: false

      - name: Build core
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          CC=${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android35-clang
          VERSION=$(CGO_ENABLED=0 go run ./cmd/internal/read_tag)
          CGO_ENABLED=0 GOARCH=amd64 GOOS=windows GOAMD64=v3 \
            go build -v -trimpath \
            -ldflags "-X github.com/sagernet/sing-box/constant.Version=${VERSION} -H windowsgui -s -w -buildid=" \
            -tags ${TAGS} ./cmd/sing-box
          CGO_ENABLED=1 CC=${CC} GOARCH=arm64 GOOS=android \
            go build -v -trimpath \
            -ldflags "-X github.com/sagernet/sing-box/constant.Version=${VERSION} -s -w -buildid=" \
            -tags ${TAGS} ./cmd/sing-box

      - name: Upload Windows
        uses: actions/upload-artifact@v4.3.1
        with:
          name: sing-box_windows
          path: sing-box*.exe

      - name: Upload Android
        uses: actions/upload-artifact@v4.3.1
        with:
          name: sing-box_android
          path: sing-box

  build-win7:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, "386"]
    env:
      TAGS: with_gvisor,with_quic,with_dhcp,with_utls,with_provider,with_clash_api,badlinkname,tfogo_checklinkname0

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache Go for Windows 7
        id: cache-go-for-windows7
        uses: actions/cache@v4
        with:
          path: |
            ~/go/go_win7
          key: go_win7_1255

      - name: Setup Go for Windows 7
        if: steps.cache-go-for-windows7.outputs.cache-hit != 'true'
        run: |
          .github/setup_go_for_windows7.sh

      - name: Use Go for Windows 7
        run: |
          echo "PATH=$HOME/go/go_win7/bin:$PATH" >> $GITHUB_ENV
          echo "GOROOT=$HOME/go/go_win7" >> $GITHUB_ENV

      - name: Build Windows 7
        env:
          GOOS: windows
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: "0"
          GOPROXY: https://goproxy.cn,direct
          GOSUMDB: sum.golang.org
          GOCACHE: ${{ runner.temp }}/go-build
          GOMODCACHE: ${{ runner.temp }}/go-mod
        run: |
          set -euxo pipefail
          mkdir -p "$GOCACHE" "$GOMODCACHE"
          go version
          VERSION=$(CGO_ENABLED=0 go run ./cmd/internal/read_tag)
          mkdir -p dist
          build_cmd() {
            go build -v -trimpath -o dist/sing-box-windows7-${{ matrix.arch }}.exe \
              -tags "${TAGS}" \
              -ldflags "-X github.com/sagernet/sing-box/constant.Version=${VERSION} -s -w -buildid=" \
              ./cmd/sing-box
          }
          build_cmd || (go clean -cache -modcache && sleep 3 && build_cmd)

      - name: Upload Windows 7
        uses: actions/upload-artifact@v4.3.1
        with:
          name: sing-box_windows7_${{ matrix.arch }}
          path: dist/sing-box-windows7-${{ matrix.arch }}.exe
